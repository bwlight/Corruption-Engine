name: corruption_engine
description: >
  Offline-first, text-based roguelike built with Flutter. Explore unstable rooms,
  face evolving threats, and survive a world driven by a spreading corruption system.

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0

  # Local storage (for saves, settings, etc.)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JSON handling
  json_annotation: ^4.9.0

  # Utility packages
  collection: ^1.18.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation for JSON models
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/data/entities/entities.json
    - assets/data/items/items.json
    - assets/data/world/rooms/rooms.json
    - assets/data/quests/main/first_steps.json
    - assets/data/threats.json
    - assets/data/hazards.json
    - assets/data/interactables.json
    - assets/data/rooms.json
    - assets/data/items.json

  fonts:
    - family: Terminal
      fonts:
        - asset: assets/fonts/terminal.ttf